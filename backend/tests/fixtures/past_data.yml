# Past-day entries are stored but invisible: they fixture the rule that a slot
# or booking whose start has passed disappears from every GET without being
# deleted from storage.
users:
  - dana
  - erin

calendars:
  - ownerId: dana
    availability:
      - day: -2
        start: "10:00"
        end: "11:00"
      - day: +1
        start: "10:00"
        end: "10:30"
    bookings:
      - id: past-booking-1
        day: -2
        start: "10:00"
        visitorName: erin
