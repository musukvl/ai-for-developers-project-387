name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      GIT_AUTHOR_NAME: OpenCode Agent
      GIT_AUTHOR_EMAIL: agent@opencode.com
      GIT_COMMITTER_NAME: OpenCode Agent
      GIT_COMMITTER_EMAIL: agent@opencode.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git author
        run: |
          git config --global user.name "OpenCode Agent"
          git config --global user.email "agent@opencode.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openai/gpt-5-mini
          use_github_token: true
          prompt: |
            Follow Conventional Commits (https://www.conventionalcommits.org/) for every new git commit message and pull request title.

            Rules:
            - Use `<type>(<optional scope>): <description>`
            - Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
            - Description is a short imperative phrase with no trailing period
            - Keep the subject under 72 characters
            - If asked to summarize changes for a commit, still use Conventional Commits, for example `fix: add header brand color`

            When working on an existing pull request branch:
            - Do not amend, rebase, or rewrite commits that already exist on the remote
            - Add a new commit instead of changing published history
            - Never force-push

            User request:
            ${{ github.event.comment.body }}
